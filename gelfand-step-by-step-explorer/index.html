<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="A nine-step Level 1 exploration of the Gelfand representation theorem."><title>Gelfand Duality — Step-by-Step Explorer</title>
<style>
:root{color-scheme:dark;--bg:#0b172b;--panel:#142745;--raised:#1e3556;--ink:#f3f6fb;--muted:#b8c7db;--gold:#f0cd79;--line:#405675;--faint:#394e6c;--formula:#0e1d34;--active:#142745;--shadow:0 16px 48px #0003}
:root[data-theme="light"]{color-scheme:light;--bg:#edf5f4;--panel:#fff;--raised:#e3f0ee;--ink:#193d42;--muted:#46646b;--gold:#086d68;--line:#a8ceca;--faint:#c1d9d6;--formula:#edf6f5;--active:#fff;--shadow:0 16px 48px #164b4412}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:780px;margin:32px auto;padding:0 16px}.shell{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:clamp(18px,4vw,36px);box-shadow:var(--shadow)}header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}h1{font-size:clamp(28px,5vw,40px);letter-spacing:-.035em;line-height:1.15;margin:8px 0 4px;color:var(--gold)}.eyebrow,.counter,.foundation-label{font-size:11px;letter-spacing:.12em;font-weight:750;color:var(--gold);text-transform:uppercase}.subtitle,.caption{color:var(--muted);font-size:14px;margin:0}.theme{flex:none;font-size:13px}button{font:inherit;cursor:pointer;min-height:44px;border:1px solid var(--line);border-radius:10px;color:var(--ink);background:transparent;padding:8px 14px}button:hover:not(:disabled){border-color:var(--gold)}button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}button:disabled{opacity:.38;cursor:default}.progress{display:grid;grid-template-columns:repeat(9,1fr);gap:5px;margin:24px 0 12px}.progress button{border:none;padding:3px 0;min-height:38px;font-size:12px;color:var(--muted)}.progress i{height:5px;display:block;margin-bottom:4px;background:var(--faint);border-radius:8px}.progress .done i{background:var(--gold)}.progress [aria-current="step"]{color:var(--gold);font-weight:800}.diagram{background:var(--raised);border-radius:15px;padding:10px 10px 12px;text-align:center;margin:0 0 24px}.diagram svg{width:100%;max-width:540px;display:block;margin:auto}.node rect{fill:var(--faint);stroke:var(--line)}.node text{fill:var(--ink);font-weight:650;font-size:15px}.node.on rect{fill:var(--gold);stroke:var(--gold)}.node.on text{fill:var(--active)}.connector{stroke:var(--muted);stroke-width:1.4;fill:none}.connector.on{stroke:var(--gold);stroke-width:2}.bridge{stroke-dasharray:4 4}.bridge.on{stroke-dasharray:none}.bridge-label{fill:var(--muted);font-size:11px}.bridge-label.on{fill:var(--gold)}.step h2{font-size:clamp(22px,4vw,30px);line-height:1.2;letter-spacing:-.025em;margin:7px 0 14px}.takeaway{color:var(--gold);font-weight:650;text-decoration:underline;text-underline-offset:4px}.step p{margin:12px 0}.formula{background:var(--formula);border-radius:12px;padding:20px 8px;text-align:center;font:clamp(20px,4vw,29px)/1.5 Georgia,"Times New Roman",serif;overflow-wrap:anywhere}.formula sub,.formula sup{font-size:.6em}.arrow{position:relative;display:inline-block;padding:0 3px}.arrow small{position:absolute;left:50%;transform:translateX(-50%);top:-.65em;font-size:.55em}.overline{text-decoration:overline}.detail{font-size:15px;color:var(--muted)}.foundation{border-top:1px solid var(--line);padding-top:17px;margin-top:22px}.foundation p{margin:4px 0 0;font-weight:600}.nav{display:flex;align-items:center;gap:8px;margin-top:24px}.nav #restart{margin-left:auto;border:none;font-size:14px}.primary{background:var(--gold);border-color:var(--gold);color:var(--active);font-weight:750}.primary:disabled{opacity:.65}.caption{font-size:12px}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:480px){main{margin:10px auto;padding:0 8px}.shell{border-radius:18px}.nav button{padding:8px 10px;font-size:14px}.theme{padding:7px 9px}.eyebrow{font-size:10px}.diagram{margin-bottom:20px}.progress{margin-top:17px}}@media(prefers-reduced-motion:no-preference){.node rect,.connector{transition:fill .18s,stroke .18s}}
</style></head><body><main><article class="shell"><header><div><div class="eyebrow">Step-by-Step Explorer · Level 1</div><h1>Gelfand Duality</h1><p class="subtitle">The abstract representation theorem</p></div><button id="theme" class="theme" aria-label="Toggle color theme">☀ Light</button></header>
<nav id="progress" class="progress" aria-label="Select proof step"></nav>
<figure class="diagram"><svg viewBox="0 0 320 108" role="img" aria-labelledby="diagram-title"><title id="diagram-title">From A through maximal ideals and the character space X to C(X)</title>
<g class="node" data-at="0"><rect x="6" y="10" width="53" height="43" rx="7"/><text x="32.5" y="36" text-anchor="middle">A</text></g>
<g class="node" data-at="1"><rect x="78" y="10" width="76" height="43" rx="7"/><text x="116" y="36" text-anchor="middle">Ideals</text></g>
<g class="node" data-at="5"><rect x="173" y="10" width="68" height="43" rx="7"/><text x="207" y="36" text-anchor="middle">X</text></g>
<g class="node" data-at="6"><rect x="260" y="10" width="54" height="43" rx="7"/><text x="287" y="36" text-anchor="middle">C(X)</text></g>
<path class="connector" data-at="1" d="M60 31 h15 m-5 -4 l5 4 -5 4"/><path class="connector" data-at="5" d="M155 31 h15 m-5 -4 l5 4 -5 4"/><path class="connector" data-at="6" d="M242 31 h15 m-5 -4 l5 4 -5 4"/>
<path class="connector bridge" data-at="8" d="M32 58 V84 H287 V58"/><rect x="109" y="73" width="102" height="22" rx="4" fill="var(--raised)"/><text x="160" y="88" text-anchor="middle" class="bridge-label" data-at="8" id="bridgeLabel">Isomorphism</text></svg><figcaption class="caption">From abstract algebra to a space of continuous functions</figcaption></figure>
<section class="step" aria-live="polite" aria-atomic="true"><div id="counter" class="counter"></div><h2 id="stepTitle"></h2><p id="takeaway" class="takeaway"></p><p id="reason"></p><div class="formula" id="formula"></div><p class="detail" id="detail"></p><div class="foundation"><div class="foundation-label">Mathematical foundation</div><p id="foundation"></p></div></section>

<script>
"use strict";
const steps=[["The objective","Reconstruct a space from an algebra.","Starting with a commutative unital C*-algebra A, we will construct a compact Hausdorff space X and establish an isometric *-isomorphism between A and C(X).","A ≅ C(X)","We'll follow the abstract proof at Level 1: identify the principal mathematical reasons and why they apply, leaving technical verifications for Level 2.","Gelfand representation theorem"],["Existence of maximal ideals","Zorn's lemma supplies maximal ideals.","The proper ideals of A form a nonempty partially ordered set under inclusion. The union of any nonempty chain of proper ideals is itself a proper ideal and provides an upper bound.","J = ⋃<sub>I∈𝒞</sub> I","The union cannot contain the identity, since that would mean one of the proper ideals contains the identity.","Zorn's lemma"],["Maximal ideals are closed","Openness of the invertible elements.","If the closure of a maximal ideal M contained the identity, M would contain an element sufficiently close to the identity to be invertible. This contradicts the properness of M.","M̅ = M","The closure is itself an ideal. Since it is proper and contains M, maximality forces equality.","Neumann series"],["Construct the quotient algebra","Closedness gives a Banach quotient; maximality gives division.","Because M is closed, A/M is a unital complex Banach algebra. Because M is maximal, every nonzero coset is invertible.","x ∉ M ⇒ M + Ax = A","Consequently, there exist m in M and a in A such that m + ax = 1. Passing to the quotient establishes invertibility.","Banach quotient theorem and maximality"],["Obtain the characters","Every complex Banach division algebra is isomorphic to ℂ.","The Gelfand–Mazur theorem applies to A/M. Composing the quotient map with the resulting isomorphism produces a character on A.","A <span class='arrow'>⟶<small>q</small></span> A/M <span class='arrow'>⟶<small>θ</small></span> ℂ","The character φ = θ ∘ q is a nonzero multiplicative linear functional. Characters have norm one.","Gelfand–Mazur theorem"],["Construct the space X","The weak-* topology supplies compactness.","Let X be the set of all characters. It is a weak-* closed subset of the closed unit ball of A*, and therefore compact by Banach–Alaoglu.","X = Spec(A) ⊆ A<sup>*</sup>","Distinct characters differ on at least one element of A. The corresponding evaluation map separates them, establishing the Hausdorff property.","Banach–Alaoglu theorem"],["Define the Gelfand transform","Elements of the algebra become functions on the character space.","For each element a of A, define a function on X by evaluating each character at a. Continuity follows from the definition of the weak-* topology.","â(φ) = φ(a)","The character identities establish linearity and multiplicativity. Characters also preserve the involution, so the transform is a *-homomorphism.","Weak-* topology and character properties"],["Establish isometry","The spectral radius recovers the original norm.","The character values of a constitute its spectrum. Since A is a commutative C*-algebra, every element is normal, and its spectral radius equals its norm.","‖â‖<sub>∞</sub> = r(a) = ‖a‖","Isometry immediately establishes injectivity: two elements with the same transform must have distance zero.","Spectral radius formula and C*-identity"],["Establish surjectivity","Density plus closedness gives equality.","The image of A contains the constants, separates the points of X and is closed under complex conjugation. Stone–Weierstrass therefore establishes density in C(X).","<span class='overline'>Â</span> = Â = C(X)","Isometry and completeness of A establish that the image is closed. Together with density, this proves surjectivity and completes the isometric *-isomorphism.","Stone–Weierstrass and completeness"]];
let current=0;
const $=id=>document.getElementById(id);
const progress=$("progress");
steps.forEach((s,i)=>{const b=document.createElement("button");b.type="button";b.innerHTML="<i aria-hidden='true'></i>"+i;b.setAttribute("aria-label","Step "+i+": "+s[0]);b.title=s[0];b.onclick=()=>render(i);progress.append(b)});
function render(i){current=Math.max(0,Math.min(steps.length-1,i));const [title,key,reason,formula,detail,foundation]=steps[current];$("counter").textContent="Step "+current+" of "+(steps.length-1);$("stepTitle").textContent=title;$("takeaway").textContent=key;$("reason").textContent=reason;$("formula").innerHTML=formula;$("detail").textContent=detail;$("foundation").textContent=foundation;[...progress.children].forEach((b,j)=>{b.classList.toggle("done",j<=current);if(j===current)b.setAttribute("aria-current","step");else b.removeAttribute("aria-current")});document.querySelectorAll("[data-at]").forEach(el=>el.classList.toggle("on",current>=Number(el.dataset.at)));$("bridgeLabel").textContent=current===8?"Isomorphism ✓":"Isomorphism";$("back").disabled=current===0;$("next").disabled=current===8;$("next").textContent=current===8?"Complete ✓":"Reveal next ›"}
$("back").onclick=()=>render(current-1);$("next").onclick=()=>render(current+1);$("restart").onclick=()=>render(0);
function theme(t){document.documentElement.dataset.theme=t;$("theme").textContent=t==="dark"?"☀ Light":"☾ Dark";try{localStorage.setItem("gelfand-explorer-theme",t)}catch(e){}}
$("theme").onclick=()=>theme(document.documentElement.dataset.theme==="dark"?"light":"dark");
try{theme(localStorage.getItem("gelfand-explorer-theme")==="light"?"light":"dark")}catch(e){theme("dark")}
document.addEventListener("keydown",e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.shiftKey)return;if(e.key==="ArrowRight"){e.preventDefault();render(current+1)}if(e.key==="ArrowLeft"){e.preventDefault();render(current-1)}});
render(0);
</script></body></html>
