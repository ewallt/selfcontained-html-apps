* { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }

.kicker { font-size:12.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); font-weight:700; }

.sub { color:var(--muted); margin:0; max-width:62ch; font-size:16px; }
.toolbar { display:flex; gap:8px; flex-wrap:wrap; }
.btn { appearance:none; border:1.5px solid var(--line); background:var(--card); color:var(--text);

.btn:hover { border-color:var(--accent); }

.theme-btn .lbl { color:var(--muted); font-weight:500; margin-right:4px; }
.theme-btn .val { color:var(--accent); }

.overview h2, .controls h2 { font-size:13px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted);
  margin:0 0 10px; font-weight:700; }
.phases { display:grid; gap:12px; grid-template-columns:1fr; }
@media (min-width:760px) { .phases { grid-template-columns:4fr 2.4fr 3fr; } }
.phase { background:var(--card); border-radius:14px; padding:12px; border:1px solid var(--line); }
.phase .ph { font-size:13px; color:var(--accent); font-weight:700; margin-bottom:8px; }
.chips { display:grid; gap:8px; grid-template-columns:1fr 1fr; }
@media (min-width:760px) { .chips { grid-template-columns:1fr; } }
.chip { text-align:left; background:var(--panel); color:var(--text); border:1.5px solid var(--line);

.chip b { color:var(--accent); margin-right:5px; }
.chip .uses { display:block; color:var(--muted); font-size:12.5px; margin-top:2px; }
.overview .note { color:var(--muted); font-size:14px; margin:10px 2px 0; }

/* Controls */
.controls { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:22px 0 14px; }
.count { color:var(--muted); font-size:14.5px; margin-left:auto; }

.step > h3 { margin:0; }
.step-head { width:100%; display:flex; gap:14px; align-items:center; text-align:left; background:none; border:0;

.hd { flex:1; min-width:0; }

.tk { color:var(--accent); font-weight:700; text-decoration:underline; text-decoration-thickness:2px;

svg .s { font-size:12px; }

svg .box { fill:var(--card); stroke:var(--line); stroke-width:1.5; }
svg .boxa { fill:var(--accent-soft); stroke:var(--accent); stroke-width:2; }
svg .boxc { fill:var(--conn-soft); stroke:var(--conn); stroke-width:1.8; }
svg .ln { fill:none; stroke:var(--muted); stroke-width:1.4; }
svg .lc { fill:none; stroke:var(--conn); stroke-width:2; }
svg .la { fill:none; stroke:var(--accent); stroke-width:2.4; }
svg .dash { stroke-dasharray:6 4; }
svg .dot { fill:var(--text); }
svg .dota { fill:var(--accent); }
svg .dotc { fill:var(--conn); }
svg .grid { fill:none; stroke:var(--line); stroke-width:1; }
@media (max-width:520px) {

/* ================= APP LOGIC ================= */
const state = { open:new Set(), focus:false, cur:1 };
const $ = s => document.querySelector(s);
const N = CONTENT.steps.length;
const byN = n => CONTENT.steps.find(s => s.n === n);

function build(){
  $('#title').textContent = CONTENT.title;
  $('#subtitle').textContent = CONTENT.subtitle;
  $('#phases').innerHTML = CONTENT.phases.map(p => `
    <div class="phase"><div class="ph">${p.name}</div><div class="chips">
    ${p.steps.map(n => { const s = byN(n); return `<button type="button" class="chip" data-go="${n}"><b>${n}</b>${s.short}<span class="uses">${s.uses.length ? 'uses ' + s.uses.join(', ') : 'starting point'}</span></button>`; }).join('')}
    </div></div>`).join('');
  $('#steps').innerHTML = CONTENT.steps.map(s => `
    <section class="step" id="step-${s.n}" data-n="${s.n}" data-open="false">
      <h3><button type="button" class="step-head" aria-expanded="false" aria-controls="panel-${s.n}" data-toggle="${s.n}">
        <span class="num ui">${s.n}</span>
        <span class="hd"><span class="tt">${s.title}</span><span class="rs ui"><i>Reason:</i> ${s.reason}</span></span>
        <span class="chev" aria-hidden="true"></span></button></h3>
      <div class="panel" id="panel-${s.n}" role="region" aria-label="Step ${s.n} details" hidden>
        <div class="panel-grid">
          <ol class="subs">${s.subs.map((x,i) => `<li><span class="sk">${s.n}${'abcdefgh'[i]}</span><div><span class="tk">${x[0]}</span> <span class="ex">${x[1]}</span></div></li>`).join('')}</ol>
          <figure>${DIAGRAMS[s.diagram]}<figcaption><b>Notice:</b> ${s.caption}</figcaption></figure>
        </div>
      </div>
    </section>`).join('');
}

function render(){
  document.body.classList.toggle('focus', state.focus);
  $('#focusBtn').setAttribute('aria-pressed', state.focus);
  $('#focusBtn').textContent = state.focus ? 'Exit focus' : 'Focus mode';
  document.querySelectorAll('.step').forEach(sec => {
    const n = +sec.dataset.n;
    const shown = state.focus ? n === state.cur : true;
    const open = state.focus ? n === state.cur : state.open.has(n);
    sec.hidden = !shown;
    sec.dataset.open = open;
    sec.querySelector('.step-head').setAttribute('aria-expanded', open);
    sec.querySelector('.panel').hidden = !open;
  });
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('open', state.open.has(+c.dataset.go)));
  const k = state.open.size;
  $('#count').innerHTML = `<b>${k}</b> of ${N} open`;
  $('#revealBtn').disabled = k === N;
  $('#resetBtn').disabled = k === 0;
  $('#pos').textContent = `Step ${state.cur} / ${N}`;
  $('#backBtn').disabled = state.cur === 1;
  $('#nextBtn').disabled = state.cur === N;
}

function scrollToStep(n){
  const el = document.getElementById('step-' + n);
  if (el) el.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'start' });
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-toggle]');
  if (t) {
    const n = +t.dataset.toggle;
    if (state.focus) return;              // in focus mode the single step stays open
    state.open.has(n) ? state.open.delete(n) : state.open.add(n);
    state.cur = n; render(); return;
  }
  const g = e.target.closest('[data-go]');
  if (g) { const n = +g.dataset.go; state.open.add(n); state.cur = n; render(); scrollToStep(n); }
});
$('#revealBtn').onclick = () => {
  for (let n = 1; n <= N; n++) if (!state.open.has(n)) { state.open.add(n); state.cur = n; render(); scrollToStep(n); return; }
};
$('#resetBtn').onclick = () => { state.open.clear(); render(); };
$('#focusBtn').onclick = () => { state.focus = !state.focus; render(); scrollToStep(state.cur); };
$('#backBtn').onclick = () => { if (state.cur > 1) { state.cur--; render(); scrollToStep(state.cur); } };
$('#nextBtn').onclick = () => { if (state.cur < N) { state.cur++; render(); scrollToStep(state.cur); } };
$('#ovBtn').onclick = () => { state.focus = false; render(); window.scrollTo({ top:0 }); };
document.addEventListener('keydown', e => {
  if (!state.focus || e.target.closest('input,textarea')) return;
  if (e.key === 'ArrowRight') $('#nextBtn').click();
  if (e.key === 'ArrowLeft') $('#backBtn').click();
});

/* Theme */
const THEME_KEY = 'gelfand-claude-theme';
function setTheme(t, save){
  document.documentElement.dataset.theme = t;
  $('#themeVal').textContent = t === 'dark' ? 'Dark' : 'Light';
  $('#themeBtn').setAttribute('aria-label', 'Theme: ' + (t === 'dark' ? 'Dark' : 'Light') + '. Switch to ' + (t === 'dark' ? 'Light' : 'Dark'));
  if (save) { try { localStorage.setItem(THEME_KEY, t); } catch (_) {} }
}
$('#themeBtn').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark', true);
let saved = null; try { saved = localStorage.getItem(THEME_KEY); } catch (_) {}
setTheme(saved === 'light' ? 'light' : 'dark', false);

build(); render();
</script>
</body>
</html>
