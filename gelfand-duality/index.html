<script>
// Add chapters to this array; each chapter owns its reveal state and illustration.
const chapters=[
{tab:'Two worlds',title:'An unexpected correspondence',subtitle:'Rich algebra. Sparse topology.',steps:[
['The two worlds','What could these have in common?','<p>On one side, an elaborate algebraic structure. On the other, points and open sets.</p><p class="note">Could each world determine the other?</p>'],
['The algebraic world','A great deal of structure','<p>A complex vector space with addition, scalar multiplication and a commutative, associative multiplication.</p><div class="math formula">a+b &nbsp; λa &nbsp; ab=ba<br>1<sub>A</sub>a=a</div><p class="small">A multiplicative identity belongs to the algebra.</p>'],
['The algebraic world','Geometry inside the algebra','<p>An involution a ↦ a* and a complete, submultiplicative norm, linked by the C*-identity.</p><div class="math formula">‖a*a‖ = ‖a‖²</div><p class="small">The involution is conjugate-linear, (ab)*=b*a*, and (a*)*=a. Completeness: every norm-Cauchy sequence converges in the algebra.</p>'],
['The topological world','Points, with a notion of closeness','<p>A topology specifies the open subsets: ∅ and X are open; arbitrary unions and finite intersections of open sets are open.</p><p><strong>Compact:</strong> every open cover has a finite subcover.</p><p><strong>Hausdorff:</strong> distinct points have disjoint open neighborhoods.</p>'],
['The mystery','How can topology remember all that?','<p>Gelfand duality gives a precise correspondence between commutative unital C*-algebras and compact Hausdorff spaces.</p><p class="note">How can points and open sets account for multiplication, involution and norm?</p>']
]},
{tab:'Characters of ℂ³',title:'Three coordinate readers',subtitle:'Discovering what multiplicativity permits.',steps:[
['The algebra','Start with complex triples','<div class="math formula">A = ℂ³<br>a = (z₁, z₂, z₃)</div><p class="small">Addition, multiplication and conjugation act coordinate by coordinate.</p><div class="math">‖a‖ = max{|z₁|, |z₂|, |z₃|}</div><p class="small">The identity is 1<sub>A</sub>=(1,1,1).</p>'],
['The question','What can a character read?','<p>A character is a <strong>nonzero complex-linear</strong> map φ:A → ℂ satisfying</p><div class="math formula">φ(ab) = φ(a)φ(b).</div><p class="small">Necessarily φ(1<sub>A</sub>)=1: choose b with φ(b)≠0 and use φ(b)=φ(1<sub>A</sub>)φ(b).</p>'],
['Idempotents','Three very special triples','<div class="math formula">eⱼ² = eⱼ</div><p>Each coordinate idempotent is unchanged by squaring.</p><p class="small">And e₁ + e₂ + e₃ = 1<sub>A</sub>.</p>'],
['Multiplicativity','Every output is forced to be 0 or 1','<div class="math formula">φ(eⱼ)² = φ(eⱼ²) = φ(eⱼ)<br>φ(eⱼ) ∈ {0,1}</div><p>In ℂ, the equation w²=w has only two solutions.</p>'],
['The identity','Exactly one survives','<div class="math formula">φ(e₁)+φ(e₂)+φ(e₃)=1</div><p>Three values, each 0 or 1. Their sum is 1.</p><p class="note">Exactly one value is 1.</p>'],
['Linearity','The surviving coordinate is the output','<div class="math formula">a = z₁e₁ + z₂e₂ + z₃e₃<br>φ(a) = ∑ zⱼφ(eⱼ)</div><p>If φ(eⱼ)=1, then φ(a)=zⱼ.</p><p class="small">Choose a reader to see which coordinate survives.</p>'],
['The discovery','Only three possible characters','<div class="math formula">δ₁(a)=z₁ &nbsp; δ₂(a)=z₂<br>δ₃(a)=z₃</div><p>Each coordinate reader is nonzero, linear and multiplicative. We have found them all.</p><p class="note">Multiplicativity is extraordinarily restrictive.</p>']
]},
{tab:'Maximal ideals of ℂ³',title:'Three ways to discard information',subtitle:'A second route to the same three possibilities.',steps:[
['The objects','An ideal absorbs multiplication','<p>An ideal I ⊆ A is a complex linear subspace such that ax ∈ I whenever a ∈ A and x ∈ I.</p><p>A <strong>maximal ideal</strong> is proper (M ≠ A), with no ideal strictly between M and A.</p>'],
['Three candidates','Set one coordinate equal to zero','<p>Each Mⱼ is an ideal: addition and scalar multiplication preserve its zero coordinate, as does multiplication by any triple.</p><p class="small">Select a plane. The picture uses real coordinate planes as an analogy; A=ℂ³ has complex dimension 3 (real dimension 6).</p>'],
['The quotient','Discard two coordinates; retain one','<div class="math formula">(z₁,z₂,z₃) + Mⱼ ↦ zⱼ<br>A/Mⱼ ≅ ℂ</div><p>Two triples represent the same coset exactly when their jth coordinates agree.</p><p class="small">This map is a well-defined bijective algebra homomorphism. The quotient is a field, so Mⱼ is maximal.</p>'],
['The connection','A kernel describes what is forgotten','<div class="math formula">Mⱼ = ker δⱼ<br>δⱼ(a) = zⱼ</div><p>The character records one coordinate. Its kernel consists of all triples whose recorded value is zero.</p><p class="note">One choice, seen from two directions.</p>'],
['Why no others?','Any maximal ideal leaves one idempotent','<p>Let M be any maximal ideal. The commutative quotient A/M is a field.</p><div class="math formula">(eⱼ+M)² = eⱼ+M<br>∑ (eⱼ+M) = 1<sub>A</sub>+M</div><p class="small">Field idempotents are 0 or 1. Exactly one is 1: the sum is 1 and the quotient, a nonzero complex algebra, has characteristic zero.</p>'],
['Exhausting the possibilities','That choice determines the entire ideal','<p>If eⱼ+M=1<sub>A</sub>+M, the other two idempotents lie in M. Their span is Mⱼ.</p><div class="math formula">Mⱼ ⊆ M ⊊ A<br>M = Mⱼ</div><p class="small">Mⱼ is already maximal. Hence every maximal ideal is one of our three.</p>'],
['The general route','From a maximal ideal to a character','<p>For a complex commutative unital Banach algebra, every maximal ideal is closed. Its quotient is a Banach division algebra.</p><p><strong>Gelfand–Mazur:</strong> that quotient is isomorphic to ℂ.</p><div class="math formula">A → A/M ≅ ℂ</div><p class="small">Compose the quotient map with this isomorphism to obtain a character. For ℂ³, the retained coordinate gives the isomorphism explicitly.</p>'],
['The same three possibilities','Read one coordinate. Forget the other two.','<div class="math formula">δ₁ ↔ M₁<br>δ₂ ↔ M₂<br>δ₃ ↔ M₃</div><p>Characters and maximal ideals recover the same three choices.</p><p class="note">What kind of space might those three choices form?</p>']
]}];
const proofMaps=[{"tab": "Characters exist", "title": "From an algebra to its characters", "subtitle": "Level 1 · Nonzero complex commutative unital C*-algebra A", "nodes": [{"title": "Maximal ideal M", "formula": "M ⊊ A", "views": ["There exists a maximal proper ideal M. An ideal is a complex linear subspace absorbing multiplication by every element of A.", "Zorn’s lemma: proper ideals are ordered by inclusion. The union of a chain is an ideal and is still proper: if it contained 1_A, one member would contain 1_A. Thus each chain has an upper bound.", "This starts the construction without assuming characters already exist. The zero algebra is excluded here; it corresponds separately to the empty space."]}, {"title": "Closure stays proper", "formula": "1_A ∉ cl(M)", "views": ["The norm closure of any proper ideal is again a proper ideal.", "It can be shown, using continuity of addition and multiplication, that the closure is an ideal. If 1_A lay in it, some m∈M would satisfy ‖1_A−m‖<1. Neumann’s lemma makes m invertible. Then m⁻¹m=1_A∈M, a contradiction.", "The key is the invertible neighborhood around 1_A. A sequence in a proper ideal cannot enter that neighborhood, so it cannot converge to 1_A."]}, {"title": "M is closed", "formula": "M ⊆ cl(M) ⊊ A ⇒ cl(M)=M", "views": ["Every maximal ideal M is norm-closed.", "Its closure is an ideal containing M and is proper by the preceding node. Maximality forces equality.", "Closedness lets the quotient norm make A/M a Banach algebra. Maximality will separately supply algebraic invertibility."]}, {"title": "Quotient is a field", "formula": "1_A = m + ax", "views": ["Every nonzero coset x+M has an inverse in A/M.", "If x∉M, then J=M+Ax is an ideal strictly containing M. Maximality gives J=A, hence 1_A=m+ax for m∈M and a∈A. In the quotient, (a+M)(x+M)=1_A+M. Commutativity gives a field.", "This is the algebraic half of the argument. It uses commutativity, the identity, and maximality—not the C*-identity."]}, {"title": "Banach division algebra", "formula": "B = A/M", "views": ["The quotient is simultaneously a complex unital Banach algebra and a division algebra.", "The quotient theorem for Banach spaces applies because M is closed. The quotient multiplication and quotient norm are compatible. The preceding field argument shows that every nonzero element is invertible.", "The analytic branch (closedness) and algebraic branch (maximality) meet here. Together they supply exactly the hypotheses of Gelfand–Mazur."]}, {"title": "Gelfand–Mazur", "formula": "A/M ≅ ℂ", "views": ["A complex unital Banach division algebra is isomorphic to ℂ.", "Apply the Gelfand–Mazur theorem to B=A/M. Retain this theorem as a black box at Level 1.", "The quotient has become a scalar-valued object. For ℂ³ this was the single coordinate retained by a quotient."]}, {"title": "A character exists", "formula": "φ: A → A/M ≅ ℂ", "views": ["Compose the quotient map q with the isomorphism to ℂ. The resulting φ is a nonzero multiplicative complex-linear functional with kernel M.", "Both maps preserve addition, scalar multiplication, multiplication and identity. Their composite does too. Since φ(1_A)=1, it is nonzero.", "We have constructed points for the future space X. Conversely, the kernel of any character is maximal, since its quotient is ℂ."]}], "edges": [[0, 1], [1, 2], [0, 3], [2, 4], [3, 4], [4, 5], [5, 6]]}, {"tab": "Character space", "title": "Characters become a compact Hausdorff space", "subtitle": "Level 1 · X is the set of all characters of A", "nodes": [{"title": "Bounded characters", "formula": "|φ(a)| ≤ ‖a‖;  ‖φ‖=1", "views": ["Every character belongs to A*, the space of bounded complex-linear functionals on A, and lies in its closed unit ball.", "If |φ(a)|>‖a‖, Neumann’s lemma would make a−φ(a)1_A invertible. Its character value is zero, impossible for an invertible element. Thus ‖φ‖≤1; φ(1_A)=1 and ‖1_A‖=1 give equality.", "This places all the characters in a common ambient compact set once we use the weak-* topology. A* denotes the dual space; a* denotes involution."]}, {"title": "Weak-* topology", "formula": "E_a(φ)=φ(a)", "views": ["Give X the topology inherited from the weak-* topology on A*. It is the coarsest topology making each E_a continuous, for every a∈A.", "A basic neighborhood tests finitely many outputs: |ψ(a_k)−φ(a_k)|<ε for k=1,…,n. Convergence of nets means pointwise convergence on every a∈A. Sequences alone need not describe the whole topology.", "The elements of A provide the tests for closeness of characters. This same choice will later make every transformed element continuous."]}, {"title": "X is weak-* closed", "formula": "φ(1_A)=1;  φ(ab)=φ(a)φ(b)", "views": ["Within the dual unit ball, X is a weak-* closed subset.", "The normalization and multiplicativity equations are closed conditions because coordinate evaluations and multiplication in ℂ are continuous. Linearity is already built into A*. The equation φ(1_A)=1 excludes the zero functional.", "Boundedness alone is not enough for the next step: we need closedness inside the compact dual unit ball."]}, {"title": "Compactness", "formula": "Banach–Alaoglu", "views": ["X is compact in the weak-* topology.", "Banach–Alaoglu makes the closed unit ball of A* weak-* compact. X lies in that ball and is weak-* closed, so it is compact as a closed subset.", "Compactness comes from an ambient compact ball plus the closed character equations. It is not a general “closed and bounded implies compact” rule."]}, {"title": "Hausdorff property", "formula": "φ ≠ ψ ⇒ φ(a) ≠ ψ(a) for some a", "views": ["Any two distinct characters can be separated by disjoint open neighborhoods.", "Distinct functionals differ on some a∈A. Choose disjoint open neighborhoods of φ(a) and ψ(a) in ℂ. Their inverse images under the continuous E_a separate φ and ψ.", "The evaluations distinguish points as well as define their topology. We will use this same distinguishing property for Stone–Weierstrass."]}, {"title": "The space is ready", "formula": "X = Spec(A)", "views": ["X is a nonempty compact Hausdorff space. Its points are characters, not elements of A.", "Existence comes from the first map; compactness and Hausdorffness come from the two branches of this map. Here Spec(A) denotes the character space, not the spectrum σ(a) of one element.", "We have reached the topological world promised in the introduction. Next we discover how A is encoded by functions on X."]}], "edges": [[0, 1], [1, 2], [0, 3], [2, 3], [1, 4], [3, 5], [4, 5]]}, {"tab": "Transform & norm", "title": "Turn each algebra element into a function", "subtitle": "Level 1 · Γ(a)=â, where â(φ)=φ(a)", "nodes": [{"title": "Reverse the viewpoint", "formula": "â: X → ℂ;  â(φ)=φ(a)", "views": ["Fix a∈A and vary the character φ. The resulting function â is continuous, so Γ maps A into C(X).", "By the definition of weak-*, E_a:φ↦φ(a) is continuous. The transformed function â is exactly E_a restricted to X.", "Previously a character read an algebra element. Now the algebra element supplies a function whose inputs are characters. C(X) means all continuous complex-valued functions on X."]}, {"title": "Preserve algebra", "formula": "Γ(ab)=Γ(a)Γ(b);  Γ(1_A)=1", "views": ["Γ preserves complex linear combinations, multiplication and identity.", "Evaluate both sides at any φ: φ(ab)=φ(a)φ(b), φ(αa+βb)=αφ(a)+βφ(b), and φ(1_A)=1. Equality at every point of X is equality of functions.", "These properties establish a unital algebra homomorphism. We still need preservation of involution, norm, and surjectivity."]}, {"title": "Preserve involution", "formula": "φ(a*) = conjugate(φ(a))", "views": ["Characters of a C*-algebra preserve the involution, so Γ is a *-homomorphism.", "Use the C*-spectral fact that a self-adjoint element h has real spectrum. A character value lies in that spectrum, since h−φ(h)1_A cannot be invertible. Write a=h+ik with h,k self-adjoint; linearity now gives the claimed conjugation identity.", "This is where C*-structure enters explicitly. The real-spectrum theorem is an identified black box at Level 1, not a consequence of linearity alone."]}, {"title": "Recover the spectrum", "formula": "σ(a) = {φ(a): φ∈X}", "views": ["The spectrum σ(a)—the scalars λ for which a−λ1_A is not invertible—is exactly the set of character values.", "A character value forces noninvertibility. Conversely, if a−λ1_A is not invertible, its principal ideal is proper by commutativity. Extend it to a maximal ideal and construct the corresponding character; it sends a to λ.", "Thus ‖â‖∞=r(a), where r(a)=sup{|λ|:λ∈σ(a)} is the spectral radius. This holds already for commutative unital Banach algebras."]}, {"title": "C*-identity supplies the norm", "formula": "r(h)=‖h‖ for h=h*", "views": ["For every self-adjoint h, the spectral radius equals its norm.", "The C*-identity gives ‖h²‖=‖h‖². Repeated squaring gives ‖h^(2^n)‖=‖h‖^(2^n). Apply the spectral-radius formula r(h)=lim_m ‖h^m‖^(1/m) along this subsequence.", "The spectral-radius formula is the named Banach-algebra black box. This step ties spectral information to the given norm without presupposing isometry."]}, {"title": "Isometry", "formula": "‖a‖² = r(a*a) = sup_φ |φ(a)|²", "views": ["The Gelfand transform preserves the norm: ‖Γ(a)‖∞=‖a‖.", "The element a*a is self-adjoint. Combine the C*-identity, the preceding self-adjoint norm result, the spectrum/character equality, and φ(a*a)=|φ(a)|². Taking square roots gives isometry.", "Three branches meet: involution, spectrum, and the C*-norm. Isometry will give both injectivity and closedness of the image."]}], "edges": [[0, 1], [1, 2], [0, 3], [2, 5], [3, 5], [4, 5]]}, {"tab": "Recover A", "title": "The image is all of C(X)", "subtitle": "Level 1 · Closed image + dense image = the whole function algebra", "nodes": [{"title": "Injectivity", "formula": "Γ(a)=Γ(b) ⇒ ‖a−b‖=0", "views": ["Distinct elements of A give distinct functions on X.", "By linearity and isometry, ‖a−b‖=‖Γ(a)−Γ(b)‖∞. If the images agree, this norm is zero, hence a=b.", "No algebraic information is lost. The remaining question is whether every continuous function on X is obtained."]}, {"title": "Closed image", "formula": "A complete + Γ isometric", "views": ["Γ(A) is closed in C(X) for the supremum norm.", "If Γ(a_n) converges uniformly to f, it is Cauchy. Isometry makes a_n Cauchy in A. Completeness gives a_n→a; isometry then gives Γ(a_n)→Γ(a), so f=Γ(a).", "This is the analytic branch. Isometry alone would not guarantee closedness without completeness of the source."]}, {"title": "Stone–Weierstrass hypotheses", "formula": "Constants · separation · conjugation", "views": ["Γ(A) is a complex subalgebra of C(X), contains constants, separates points, and is closed under complex conjugation.", "The homomorphism properties give a subalgebra and constants. Distinct characters differ on some a, so â separates them. Preservation of involution gives conjugate(â)=Γ(a*). X is compact Hausdorff.", "These are the precise hypotheses of complex Stone–Weierstrass. Point separation concerns distinct characters, not injectivity of Γ on A."]}, {"title": "Dense image", "formula": "closure(Γ(A)) = C(X)", "views": ["Γ(A) is uniformly dense in C(X).", "Apply the complex Stone–Weierstrass theorem using all the hypotheses in the preceding node. Retain its proof as a black box at Level 1.", "Density gives arbitrarily good uniform approximations. It does not by itself say that a function is exactly a transformed element."]}, {"title": "Surjectivity", "formula": "Closed + dense ⇒ Γ(A)=C(X)", "views": ["Every continuous function f:X→ℂ is Γ(a) for some a∈A.", "The image equals its closure because it is closed. Its closure equals C(X) because it is dense. Therefore the image is the whole of C(X).", "The analytic and approximation branches meet. This is the second half of bijectivity."]}, {"title": "Representation theorem", "formula": "A ≅ C(Spec(A))", "views": ["Γ is an isometric unital *-isomorphism. The algebra has been recovered as continuous functions on its compact Hausdorff character space.", "Combine the homomorphism and involution identities with isometry, injectivity and surjectivity. This completes the abstract representation proof.", "The opening mystery is resolved: points and topology determine continuous functions, whose pointwise operations, conjugation and supremum norm recover the rich algebraic structure."]}, {"title": "The other direction", "formula": "Y ≅ Spec(C(Y))", "views": ["For compact Hausdorff Y, send y to evaluation at y. This recovers Y from its function algebra.", "Every character of C(Y) is evaluation: its maximal kernel has a common zero, since otherwise compactness gives finitely many f_i in the kernel with Σ|f_i|² strictly positive and invertible—a contradiction. Continuous functions separate points of Y. The evaluation map is a continuous bijection from compact Y to Hausdorff Spec(C(Y)), hence a homeomorphism.", "For full categorical duality, continuous f:Y→Z induces pullback g↦g∘f, and a unital *-homomorphism θ:A→B induces φ↦φ∘θ from Spec(B) to Spec(A). These reverse arrows; the identifications are natural."]}], "edges": [[0, 5], [1, 4], [2, 3], [3, 4], [4, 5], [5, 6]]}];
chapters.push(...proofMaps.map(m=>({...m,steps:m.nodes.map(n=>["Level 1",n.title,""]),map:true})));

let lens=0;
function positions(n){return n===7?[[4,3],[53,3],[4,28],[53,28],[4,53],[53,53],[28.5,78]]:[[4,5],[53,5],[4,36],[53,36],[4,67],[53,67]]}
function render(){
const mapped=current>=3;document.querySelector('.stage').style.display=mapped?'none':'';
let target=document.getElementById('mapcontent');if(!target){target=document.createElement('div');target.id='mapcontent';$('panel').append(target)}target.hidden=!mapped;
if(!mapped){renderIntro();return}
const m=proofMaps[current-3],j=states[current].step,n=m.nodes[j],pos=positions(m.nodes.length);
$('tabs').innerHTML=chapters.map((c,i)=>`<button id="tab-${i}" role="tab" aria-controls="panel" aria-selected="${i===current}" tabindex="${i===current?0:-1}" data-tab="${i}">${c.tab}</button>`).join('');
$('panel').setAttribute('aria-labelledby','tab-'+current);$('title').textContent=m.title;$('subtitle').textContent=m.subtitle;
const arrows=m.edges.map(([a,b])=>{let [x,y]=pos[a],[u,v]=pos[b];x+=21.5;u+=21.5;y+=8;v+=8;let same=Math.abs(v-y)<1;let x1=same?x+(u>x?21.5:-21.5):x,y1=same?y:y+8,x2=same?u+(u>x?-21.5:21.5):u,y2=same?v:v-8;let active=a===j||b===j;return `<path d="M${x1} ${y1} L${x2} ${y2}" fill="none" stroke="${active?'#83d7d0':'#526b8e'}" stroke-width="${active?.65:.4}" marker-end="url(#arrow)"/>`}).join('');
const nodes=m.nodes.map((v,i)=>`<button class="mapnode ${i===j?'selected':m.edges.some(([a,b])=>(a===j&&b===i)||(b===j&&a===i))?'related':''}" style="left:${pos[i][0]}%;top:${pos[i][1]}%" data-node="${i}" aria-pressed="${i===j}"><small>${i+1}</small>${v.title}</button>`).join('');
target.innerHTML=`<p class="maphint">Select any concept. Lines show how results feed into later steps; Back and Next follow the suggested order.</p><div class="mapstage"><div class="mapboard" aria-label="Proof dependency map"><svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#83d7d0"/></marker></defs>${arrows}</svg>${nodes}</div><article class="mapdetail" aria-live="polite"><div class="lenses" aria-label="Concept perspectives">${['Claim','Reason','Role in proof'].map((v,i)=>`<button data-lens="${i}" aria-pressed="${i===lens}">${v}</button>`).join('')}</div><div class="stepname">Concept ${j+1} of ${m.nodes.length}</div><h3>${n.title}</h3><div class="math formula">${n.formula.replaceAll('1_A','1<sub>A</sub>')}</div><p>${n.views[lens].replaceAll('1_A','1<sub>A</sub>')}</p><div class="assumptions">${current===3?'Uses the commutative unital Banach-algebra structure.':current===4?'Weak-* topology on the dual; characters form X.':current===5?'The C*-identity bridges spectrum and norm.':'The image is a subalgebra of C(X), with the supremum norm.'}</div></article></div><details class="mapoverview"><summary>View the whole map’s claims</summary><ol>${m.nodes.map(v=>`<li><strong>${v.title}.</strong> ${v.views[0]}</li>`).join('')}</ol></details>`;
$('progress').innerHTML=`<span class="counter">Map ${current-2} of 4 · Concept ${j+1} / ${m.nodes.length}</span>`;$('back').disabled=j===0;$('next').disabled=j===m.nodes.length-1;$('next').textContent=j===m.nodes.length-1?'Map complete':'Next concept';
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.node!==undefined){if(states[current].step!==+b.dataset.node)lens=0;states[current].step=+b.dataset.node;render();document.querySelector(`[data-node="${states[current].step}"]`).focus({preventScroll:true})}if(b.dataset.lens!==undefined){lens=+b.dataset.lens;render();document.querySelector(`[data-lens="${lens}"]`).focus({preventScroll:true})}});

const states=chapters.map(()=>({step:0,pick:0,numeric:false}));let current=0;
const $=id=>document.getElementById(id),sub=['₁','₂','₃'];
function selectors(kind){return '<div class="selectors">'+sub.map((s,i)=>`<button data-pick="${i}" aria-pressed="${states[current].pick===i}">${kind}${s}</button>`).join('')+'</div>'}
function tuple(selected,dim=false,numeric=false){return '<div class="triple"><span>(</span>'+sub.map((s,i)=>`<span class="coord c${i} ${dim&&i!==selected?'dim':''}">${numeric?['2+i','−1','3−2i'][i]:'z'+s}</span>`).join('<span>,</span>')+'<span>)</span></div>'}
function plane(j){let polys=['270,160 360,105 360,30 270,85','270,160 160,115 160,40 270,85','160,115 270,160 360,105 250,60'];return `<svg class="plane" viewBox="100 0 320 210" role="img" aria-label="Real coordinate plane analogy for M${sub[j]}"><path d="M270 160L125 100M270 160L390 85M270 160L270 12" stroke="#879bb7" stroke-width="2"/><polygon points="${polys[j]}" fill="${['#F0CD79','#83d7d0','#c4b4fa'][j]}" fill-opacity=".2" stroke="${['#F0CD79','#83d7d0','#c4b4fa'][j]}" stroke-width="2"/><g fill="#faf9f5" font-size="19" font-family="Georgia"><text x="105" y="98">x₁</text><text x="390" y="85">x₂</text><text x="280" y="20">x₃</text></g></svg>`}
function visual(){const {step:s,pick:j,numeric:n}=states[current];if(current===0)return `<div class="worlds"><div class="world"><div class="eyebrow">Algebra</div><div class="symbol">A</div><h3>Commutative<br>unital C*-algebra</h3><p>${s>=1?'a+b &nbsp; λa &nbsp; ab &nbsp; 1<sub>A</sub>':'Operations & structure'}${s>=2?'<br>a* &nbsp; ‖a‖ &nbsp; completeness':''}</p></div><div class="question">?</div><div class="world"><div class="eyebrow">Topology</div><svg class="space" viewBox="0 0 200 100" aria-label="Points with disjoint open neighborhoods"><ellipse cx="55" cy="50" rx="38" ry="30" fill="#83d7d0" fill-opacity=".12" stroke="#83d7d0" stroke-dasharray="4 4"/><ellipse cx="146" cy="50" rx="36" ry="34" fill="#c4b4fa" fill-opacity=".12" stroke="#c4b4fa" stroke-dasharray="4 4"/><circle cx="55" cy="50" r="5" fill="#83d7d0"/><circle cx="146" cy="50" r="5" fill="#c4b4fa"/></svg><h3>Compact Hausdorff<br>space</h3><p>${s>=3?'Open sets · finite subcovers<br>Separated points':'Points & open sets'}</p></div></div><div class="caption">${s===4?'Two worlds. An extraordinarily close correspondence.':'How much structure does each world carry?'}</div>`;
if(current===1){if(s>=2&&s<=4)return '<div class="eyebrow">The coordinate idempotents</div><div class="idempotents">'+sub.map((x,i)=>`<div class="idem c${i}">e${x}<br>${['(1,0,0)','(0,1,0)','(0,0,1)'][i]}<span class="value">${s===2?'e'+x+'²=e'+x:s===3?'0 or 1':i===j?'1':'0'}</span></div>`).join('')+'</div>'+(s===4?selectors('φ(e') .replaceAll('</button>',')</button>'):'')+`<p class="caption">${s===2?'Square coordinate by coordinate.':s===3?'Possible values of φ on each idempotent.':'Select the idempotent sent to 1; the other two must be sent to 0.'}</p>`;
return '<div class="eyebrow">'+(s<2?'An element of ℂ³':'Choose a coordinate reader')+'</div>'+tuple(j,s>=5,n)+(s>=5?selectors('δ')+`<div class="result c${j}">δ${sub[j]}(a) = ${n?['2+i','−1','3−2i'][j]:'z'+sub[j]}</div><button id="example" class="small">${n?'Use symbolic coordinates':'Use a complex example'}</button>`:s===1?'<div class="result">φ(a) = ?</div>':'<div class="caption">Three coordinates, each a complex number.</div>');}
if(s===0)return '<div class="eyebrow">Inside the algebra</div><svg viewBox="0 0 550 300" class="wide" role="img" aria-label="A proper ideal contained in an algebra"><rect x="40" y="20" width="470" height="260" rx="25" fill="none" stroke="#617895"/><ellipse cx="275" cy="155" rx="140" ry="85" fill="#F0CD79" fill-opacity=".1" stroke="#F0CD79"/><g fill="#faf9f5" font-family="Georgia" font-size="28"><text x="460" y="65">A</text><text x="270" y="135">I</text><text x="205" y="180">x, y, ax ∈ I</text></g></svg><div class="caption">A linear subspace stable under multiplication by all of A.</div>';
if(s===6)return '<div class="eyebrow">Complex · commutative · unital · Banach</div><div class="route" style="margin-top:35px"><span>Maximal ideal M</span>→<span>Banach division algebra A/M</span>→<span>ℂ</span>→<span>Character</span></div><p class="caption">Gelfand–Mazur supplies the middle identification.</p>';
return `<div class="eyebrow">${s<2?'Three coordinate ideals':s>=4&&s<=5?'The surviving coordinate':'Information retained by the quotient'}</div>`+(s===1?plane(j):tuple(j,true,n))+`<div class="math idealformula">M${sub[j]} = {(${sub.map((x,i)=>i===j?'0':'z'+x).join(', ')})}</div>`+selectors('M')+(s>=2?`<div class="result c${j}">${s===3||s===7?'ker δ'+sub[j]+' = M'+sub[j]:'a + M'+sub[j]+' ↦ z'+sub[j]}</div>`:'')+`<div class="caption">${s===1?'Real-plane analogy only: the actual coordinates are complex.':'The dimmed coordinates may vary freely within a coset.'}</div>`;
}
function renderIntro(){const ch=chapters[current],s=states[current].step,st=ch.steps[s];$('tabs').innerHTML=chapters.map((c,i)=>`<button id="tab-${i}" role="tab" aria-controls="panel" aria-selected="${i===current}" tabindex="${i===current?0:-1}" data-tab="${i}">${c.tab}</button>`).join('');$('panel').setAttribute('aria-labelledby','tab-'+current);$('title').textContent=ch.title;$('subtitle').textContent=ch.subtitle;$('stepname').textContent=st[0];$('heading').textContent=st[1];$('explanation').innerHTML=st[2];$('visual').innerHTML=visual();$('progress').innerHTML=ch.steps.map((_,i)=>`<button data-step="${i}" class="${i===s?'active':''}" aria-label="Observation ${i+1}" ${i===s?'aria-current="step"':''}></button>`).join('')+`<span class="counter">${s+1} / ${ch.steps.length}</span>`;$('back').disabled=s===0;$('next').disabled=s===ch.steps.length-1;$('next').textContent=s===ch.steps.length-1?'Tab complete':'Reveal next';}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab!==undefined){lens=0;current=+b.dataset.tab;render();$('tab-'+current).focus()}if(b.dataset.pick!==undefined){states[current].pick=+b.dataset.pick;render();document.querySelector(`[data-pick="${states[current].pick}"]`).focus()}if(b.dataset.step!==undefined){lens=0;states[current].step=+b.dataset.step;render()}if(b.id==='example'){states[current].numeric=!states[current].numeric;render()}});
function move(d){lens=0;states[current].step=Math.max(0,Math.min(chapters[current].steps.length-1,states[current].step+d));render()}
$('next').onclick=()=>move(1);$('back').onclick=()=>move(-1);$('reset').onclick=()=>{states[current]={step:0,pick:0,numeric:false};lens=0;render()};async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{ $('fullscreen').textContent='Use browser full screen'}}$('fullscreen').onclick=fullscreen;document.addEventListener('fullscreenchange',()=>{$('fullscreen').textContent=document.fullscreenElement?'Exit full screen':'Full screen'});document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey)return;if(e.target.matches('[role=tab]')&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();lens=0;current=e.key==='Home'?0:e.key==='End'?chapters.length-1:(current+(e.key==='ArrowRight'?1:chapters.length-1))%chapters.length;render();$('tab-'+current).focus();return}if(e.key==='ArrowRight'){e.preventDefault();move(1)}if(e.key==='ArrowLeft'){e.preventDefault();move(-1)}if(['1','2','3','4','5','6','7'].includes(e.key)){lens=0;current=+e.key-1;render()}if(e.key.toLowerCase()==='f')fullscreen()});render();
</script></body></html>
